spring.application.name=byte-battle-backend
server.port=${SERVER_PORT:8080}

# ===== Database (PostgreSQL) =====
# DB_PASSWORD has no default on purpose: the app refuses to start without it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bytebattle_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate (Flyway owns the schema; Hibernate only validates it) =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Logging =====
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.bytebattle=INFO

# ===== JWT =====
# JWT_SECRET must be a random string of at least 32 bytes; the app fails fast at startup otherwise.
# There is deliberately NO default. For local development activate the "dev" profile.
bytebattle.jwt.secret=${JWT_SECRET:}
bytebattle.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Admin bootstrap (optional) =====
# If set and a user with this email exists at startup, that user is promoted to ADMIN. No default.
bytebattle.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}

# ===== CORS (comma separated list of allowed origins) =====
bytebattle.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ===== Email (SMTP) - for Forgot Password =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Used inside the reset password email link
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===== Python AI service =====
bytebattle.ai.base-url=${AI_BASE_URL:http://localhost:8000}
bytebattle.ai.enabled=${AI_ENABLED:true}
bytebattle.ai.connect-timeout-ms=2000
bytebattle.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:20000}
# Single source of truth: personalization defaults to the same base URL
bytebattle.ai.personalization.base-url=${AI_PERSONALIZATION_URL:${bytebattle.ai.base-url}}

# ===== Judge0 Code Execution =====
bytebattle.judge0.enabled=${JUDGE0_ENABLED:true}
bytebattle.judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
bytebattle.judge0.auth-token=${JUDGE0_AUTH_TOKEN:}
bytebattle.judge0.poll-interval-ms=${JUDGE0_POLL_INTERVAL_MS:500}
bytebattle.judge0.max-poll-attempts=${JUDGE0_MAX_POLL_ATTEMPTS:60}
bytebattle.judge0.default-time-limit-ms=${JUDGE0_DEFAULT_TIME_LIMIT_MS:5000}
bytebattle.judge0.default-memory-limit-mb=${JUDGE0_DEFAULT_MEMORY_LIMIT_MB:256}
bytebattle.judge0.max-time-limit-ms=${JUDGE0_MAX_TIME_LIMIT_MS:15000}
bytebattle.judge0.max-memory-limit-mb=${JUDGE0_MAX_MEMORY_LIMIT_MB:512}
bytebattle.judge0.max-test-cases=${JUDGE0_MAX_TEST_CASES:50}
bytebattle.judge0.overall-deadline-ms=${JUDGE0_OVERALL_DEADLINE_MS:60000}
bytebattle.judge0.connect-timeout-ms=${JUDGE0_CONNECT_TIMEOUT_MS:3000}
bytebattle.judge0.read-timeout-ms=${JUDGE0_READ_TIMEOUT_MS:10000}
bytebattle.judge0.batch-size=${JUDGE0_BATCH_SIZE:20}
bytebattle.judge0.max-processes-and-or-threads=${JUDGE0_MAX_PROCESSES_AND_OR_THREADS:60}
bytebattle.judge0.stack-limit-kb=${JUDGE0_STACK_LIMIT_KB:64000}
bytebattle.judge0.wall-time-extra-ms=${JUDGE0_WALL_TIME_EXTRA_MS:5000}
bytebattle.judge0.max-wall-time-limit-ms=${JUDGE0_MAX_WALL_TIME_LIMIT_MS:20000}

# ===== Coding follow-up (async personalization + AI feedback) =====
bytebattle.coding.ai-feedback-timeout-ms=${CODING_AI_FEEDBACK_TIMEOUT_MS:8000}
bytebattle.judge0.language-ids.C=${JUDGE0_LANGUAGE_C:50}
bytebattle.judge0.language-ids.CPP=${JUDGE0_LANGUAGE_CPP:54}
bytebattle.judge0.language-ids.JAVA=${JUDGE0_LANGUAGE_JAVA:62}
bytebattle.judge0.language-ids.JAVASCRIPT=${JUDGE0_LANGUAGE_JAVASCRIPT:63}
bytebattle.judge0.language-ids.PYTHON=${JUDGE0_LANGUAGE_PYTHON:71}
