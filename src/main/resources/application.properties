# ===== Database Connection (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/bytebattle_db
spring.datasource.username=judge0
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Email (Gmail SMTP) - for Forgot Password =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=bhopalpoetryadda@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Used inside the reset password email link (update later when frontend exists)
app.frontend-url=http://localhost:3000

# ===== Server Port =====
server.port=8080
# Python personalization AI service
bytebattle.ai.personalization.base-url=${AI_PERSONALIZATION_URL:http://localhost:8000}

# ===== Judge0 Code Execution =====
bytebattle.judge0.enabled=${JUDGE0_ENABLED:true}
bytebattle.judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
bytebattle.judge0.auth-token=${JUDGE0_AUTH_TOKEN:}
bytebattle.judge0.poll-interval-ms=${JUDGE0_POLL_INTERVAL_MS:500}
bytebattle.judge0.max-poll-attempts=${JUDGE0_MAX_POLL_ATTEMPTS:60}
bytebattle.judge0.default-time-limit-ms=${JUDGE0_DEFAULT_TIME_LIMIT_MS:2000}
bytebattle.judge0.default-memory-limit-mb=${JUDGE0_DEFAULT_MEMORY_LIMIT_MB:128}
bytebattle.judge0.max-time-limit-ms=${JUDGE0_MAX_TIME_LIMIT_MS:10000}
bytebattle.judge0.max-memory-limit-mb=${JUDGE0_MAX_MEMORY_LIMIT_MB:512}
bytebattle.judge0.max-test-cases=${JUDGE0_MAX_TEST_CASES:50}
bytebattle.judge0.language-ids.C=${JUDGE0_LANGUAGE_C:50}
bytebattle.judge0.language-ids.CPP=${JUDGE0_LANGUAGE_CPP:54}
bytebattle.judge0.language-ids.JAVA=${JUDGE0_LANGUAGE_JAVA:62}
bytebattle.judge0.language-ids.JAVASCRIPT=${JUDGE0_LANGUAGE_JAVASCRIPT:63}
bytebattle.judge0.language-ids.PYTHON=${JUDGE0_LANGUAGE_PYTHON:71}
